<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Match Masters — Redesign Directions</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#101116;color:#f7f7f8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    header{padding:28px 28px 18px;border-bottom:1px solid #30313a} h1{margin:0 0 7px;font-size:clamp(24px,4vw,42px)}
    header p{margin:0;color:#a8a9b3;max-width:760px} nav{display:flex;gap:10px;padding:16px 28px;overflow:auto;position:sticky;top:0;background:#101116ee;backdrop-filter:blur(14px);z-index:3;border-bottom:1px solid #292a32}
    button{border:1px solid #3a3b46;background:#20212a;color:#ddd;padding:11px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700}
    button.active{background:#ff4f82;border-color:#ff4f82;color:#fff} main{padding:30px 28px 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
    h2{margin:0;font-size:clamp(24px,3vw,38px)} #note{color:#a8a9b3;max-width:600px}.slides{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;align-items:start}
    figure{margin:0} img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;display:block;box-shadow:0 14px 40px #0008} figcaption{padding-top:8px;color:#8e909b;font-size:12px}
    .archive{display:inline-block;margin-top:40px;color:#a8a9b3;font-size:13px} @media(min-width:1400px){.slides{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
  <header><h1>New carousel design directions</h1><p>The original 25-carousel layouts are paused. Choose the visual language below before the full set is rebuilt.</p></header>
  <nav id="nav"></nav>
  <main><div class="intro"><h2 id="title"></h2><div id="note"></div></div><section class="slides" id="slides"></section><a class="archive" href="original-review.html">View the rejected first version</a></main>
  <script>
    const options=[
      {id:'a-raw-ugc',name:'A — Raw UGC',note:'Full-bleed photos, huge hooks, high contrast, minimal decoration. Closest to native TikTok/Instagram creator content.'},
      {id:'b-editorial-zine',name:'B — Editorial zine',note:'Asymmetric magazine composition, bold typography, purposeful crops, and restrained color accents.'},
      {id:'c-social-comic',name:'C — Social comic',note:'Playful speech bubbles, chunky cards, expressive color, and a clearer story-panel rhythm.'}
    ];
    const nav=document.querySelector('#nav'),slides=document.querySelector('#slides'),title=document.querySelector('#title'),note=document.querySelector('#note');
    function show(i){[...nav.children].forEach((b,j)=>b.classList.toggle('active',i===j)); const o=options[i]; title.textContent=o.name; note.textContent=o.note; slides.innerHTML='';
      for(let s=1;s<=5;s++){const sid=String(s).padStart(2,'0'),src=`concepts/${o.id}/slide-${sid}.jpg`,fig=document.createElement('figure');fig.innerHTML=`<a href="${src}" target="_blank"><img src="${src}" alt="${o.name}, slide ${s}"></a><figcaption>Slide ${sid}</figcaption>`;slides.appendChild(fig)}
      history.replaceState(null,'',`#${o.id}`);scrollTo({top:0,behavior:'smooth'})}
    options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.name;b.onclick=()=>show(i);nav.appendChild(b)});
    const initial=Math.max(0,options.findIndex(o=>location.hash.slice(1)===o.id));show(initial);
  </script>
</body>
</html>
